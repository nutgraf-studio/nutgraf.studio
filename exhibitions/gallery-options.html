<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Gallery — filter and mosaic options</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,600;1,9..144,900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   EXHIBITIONS GALLERY — four takes on the Între noi photos
   The gallery section from index.html with the 16 real photos
   (img/intre-noi-NN.jpg, NN = upload order). Each option pairs a
   mosaic with a filter; switch with the lower bar or keys 1–4.
   The upper bar swaps the filter on its own, so any filter can be
   tried on any mosaic. Filters are plain CSS on the <img>, except
   Violet, an SVG tritone mapped to the site's black, violet, cream.
   Every filter lifts to full colour on hover.
   ============================================================ */

:root {
  --mint:   #9FF29A;
  --violet: #7B7BF0;
  --black:  #0A0A0A;
  --cream:  #EDE9E1;
  --white:  #FFFFFF;
  --ink-2:  #1A1A1A;

  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  --max-w: 80rem;
  --pad: 1.5rem;

  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-io:  cubic-bezier(0.83, 0, 0.17, 1);
}

/* ---------- Reset / base (as index.html) ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--cream);
  background: var(--black);
  -webkit-font-smoothing: antialiased;
  padding-bottom: 9rem; /* room for the switch bars */
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1.02;
}
h1 em, h2 em, h3 em { font-style: italic; font-weight: 600; }
.wrap { max-width: var(--max-w); margin-inline: auto; padding-inline: var(--pad); }
@media (min-width: 900px) { :root { --pad: 2.5rem; } }
.kicker {
  display: inline-block;
  font-size: 0.8125rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin-bottom: 1.25rem;
}
:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }

/* ---------- Preview chrome: which option is showing ---------- */
.opt-band {
  border-bottom: 1px solid rgba(237, 233, 225, 0.12);
  background: #121212;
  padding-block: 1rem;
  font-size: 0.875rem;
  color: rgba(237, 233, 225, 0.75);
}
.opt-band .wrap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.875rem; }
.opt-band .tag {
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--black);
  background: var(--mint);
  border-radius: 999px;
  padding: 0.15rem 0.55rem;
}
.opt-band strong { color: var(--white); font-weight: 700; }

/* ============================================================
   GALLERY — section head as index.html
   ============================================================ */
.gallery { background: var(--black); padding-block: clamp(4rem, 8vw, 6rem); }
.gallery-head {
  display: grid;
  gap: 1rem;
  margin-bottom: clamp(2.5rem, 5vw, 3.5rem);
}
@media (min-width: 900px) { .gallery-head { grid-template-columns: 1fr auto; align-items: end; } }
.gallery .kicker { color: var(--mint); }
.gallery h2 { color: var(--white); font-size: clamp(2.25rem, 5.2vw, 4.25rem); max-width: 14ch; }
.gallery-note { font-size: 0.9375rem; color: rgba(237, 233, 225, 0.7); max-width: 22rem; }

/* ---------- Filters ----------
   One variable per look, read by every photo. */
.gallery[data-filter="mono"]   { --f: grayscale(1) contrast(1.12) brightness(0.95); }
.gallery[data-filter="warm"]   { --f: sepia(0.28) saturate(0.82) contrast(1.04) brightness(1.03); }
.gallery[data-filter="violet"] { --f: url(#tritone); }
.gallery[data-filter="matte"]  { --f: saturate(0.68) contrast(0.86) brightness(1.06); }
.gallery[data-filter="none"]   { --f: none; }
.gallery img.ph {
  filter: var(--f, none);
  transition: filter 0.6s ease, transform 1.2s var(--ease-out), opacity 0.35s ease;
}
.gallery a:hover img.ph,
.gallery a:focus-visible img.ph,
.gallery .thumb:hover img.ph,
.feature-lead:hover img.ph { filter: none; }

/* ============================================================
   MOSAIC 1 — Editorial: the index.html grid, extended to 16.
   12 columns; each tile sets --c / --r, and --mc / --mr on phones.
   ============================================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-auto-rows: 44vw;
  grid-auto-flow: dense;
  gap: 0.5rem;
}
@media (min-width: 760px) {
  .grid {
    grid-template-columns: repeat(12, 1fr);
    grid-auto-rows: clamp(8rem, 13vw, 12.5rem);
    gap: 0.75rem;
  }
}
.tile {
  grid-column: span var(--mc, 1);
  grid-row: span var(--mr, 1);
  position: relative;
  overflow: hidden;
}
@media (min-width: 760px) {
  .tile { grid-column: span var(--c, 4); grid-row: span var(--r, 1); }
}
.tile a { display: block; width: 100%; height: 100%; cursor: zoom-in; background: var(--ink-2); }
.tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.tile a:hover img, .tile a:focus-visible img { transform: scale(1.05); }
.tile figcaption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 2rem 1rem 0.875rem;
  background: linear-gradient(to top, rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0));
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--cream);
  display: flex;
  gap: 0.625rem;
  transform: translateY(100%);
  transition: transform 0.45s var(--ease-out);
  pointer-events: none;
}
.tile figcaption .n { font-variant-numeric: tabular-nums; color: var(--mint); font-weight: 700; }
.tile a:hover + figcaption,
.tile a:focus-visible + figcaption { transform: none; }
@media (hover: none) { .tile figcaption { display: none; } }

/* ============================================================
   MOSAIC 4 — Tight: 6 columns (3 on phones) with 3px seams.
   Rows are sized so a 1×1 tile is exactly 3:2, like the photos.
   ============================================================ */
.grid.tight {
  --g: 3px;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: calc((100vw - 2 * var(--pad) - 2 * var(--g)) / 3 / 1.5);
  gap: var(--g);
}
@media (min-width: 760px) {
  .grid.tight {
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: calc((min(100vw, var(--max-w)) - 2 * var(--pad) - 5 * var(--g)) / 6 / 1.5);
  }
}
.grid.tight .tile figcaption { padding: 1.5rem 0.75rem 0.625rem; font-size: 0.75rem; }

/* ============================================================
   MOSAIC 2 — Contact sheet: every frame uncropped at 3:2,
   numbered and captioned underneath.
   ============================================================ */
.sheet {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.5rem 0.5rem;
}
@media (min-width: 760px) { .sheet { grid-template-columns: repeat(4, 1fr); gap: 2.25rem 0.75rem; } }
.sheet a { display: block; overflow: hidden; background: var(--ink-2); cursor: zoom-in; }
.sheet img { width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; }
.sheet a:hover img, .sheet a:focus-visible img { transform: scale(1.04); }
.sheet figcaption {
  margin-top: 0.625rem;
  display: flex;
  gap: 0.625rem;
  font-size: 0.8125rem;
  line-height: 1.35;
  color: rgba(237, 233, 225, 0.78);
}
.sheet figcaption .n { font-variant-numeric: tabular-nums; color: var(--mint); font-weight: 700; }

/* ============================================================
   MOSAIC 3 — Feature + strip: one large frame, all 16 below.
   ============================================================ */
.feature-lead {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  background: var(--ink-2);
}
@media (min-width: 760px) { .feature-lead { aspect-ratio: 2 / 1; } }
.feature-lead img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.feature-lead img.fading { opacity: 0; }
.feature-cap {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 3rem 1.25rem 1rem;
  background: linear-gradient(to top, rgba(10, 10, 10, 0.75), rgba(10, 10, 10, 0));
  display: flex;
  gap: 0.75rem;
  align-items: baseline;
  font-size: 0.9375rem;
  font-weight: 500;
  pointer-events: none;
}
.feature-cap .n { font-variant-numeric: tabular-nums; color: var(--mint); font-weight: 700; }
.strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.375rem;
  margin-top: 0.375rem;
  list-style: none;
}
@media (min-width: 760px) { .strip { grid-template-columns: repeat(8, 1fr); gap: 0.5rem; margin-top: 0.5rem; } }
.thumb { display: block; width: 100%; position: relative; overflow: hidden; background: var(--ink-2); }
.thumb img { width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; opacity: 0.5; }
.thumb:hover img, .thumb[aria-current="true"] img { opacity: 1; }
.thumb[aria-current="true"]::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 0 2px var(--mint);
  pointer-events: none;
}

/* ============================================================
   SWITCH BARS (as hero-phosphor-options.html)
   ============================================================ */
.switches {
  position: fixed;
  left: 50%;
  bottom: 1rem;
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  width: max-content;
  max-width: calc(100vw - 2rem);
}
.opt-switch,
.filter-switch {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.25rem;
  width: max-content;
  max-width: calc(100vw - 2rem);
  padding: 0.3rem;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(237, 233, 225, 0.12);
}
.opt-switch button,
.filter-switch button {
  font: 500 0.8125rem/1 var(--font-body);
  color: var(--cream);
  border-radius: 999px;
  padding: 0.55rem 0.85rem;
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  white-space: nowrap;
}
.opt-switch button:hover,
.filter-switch button:hover { background: rgba(237, 233, 225, 0.1); }
.opt-switch button:focus-visible,
.filter-switch button:focus-visible { outline: 2px solid var(--mint); outline-offset: 1px; }
.opt-switch button[aria-pressed="true"],
.filter-switch button[aria-pressed="true"] { background: var(--mint); color: var(--black); }
.opt-switch .k {
  font-weight: 700;
  font-size: 0.6875rem;
  width: 1.25rem;
  height: 1.25rem;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  background: rgba(237, 233, 225, 0.14);
}
.opt-switch button[aria-pressed="true"] .k { background: rgba(10, 10, 10, 0.12); }
.opt-switch .tech { font-size: 0.625rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.55; }
.filter-switch { gap: 0.125rem; padding: 0.2rem; align-items: center; }
.filter-switch button { font-size: 0.75rem; padding: 0.4rem 0.7rem; }
.filter-switch .label {
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(237, 233, 225, 0.55);
  padding: 0 0.4rem 0 0.6rem;
}
.filter-switch .sep { width: 1px; align-self: stretch; margin: 0.3rem 0.2rem; background: rgba(237, 233, 225, 0.18); }
.filter-switch button[data-filter="none"][aria-pressed="true"] { background: var(--cream); }
@media (max-width: 599px) {
  .opt-switch { display: grid; grid-template-columns: repeat(2, 1fr); width: calc(100vw - 2rem); border-radius: 1.1rem; gap: 0.125rem; }
  .opt-switch button { justify-content: center; padding: 0.55rem 0.4rem; font-size: 0.75rem; }
  .opt-switch .k, .opt-switch .tech { display: none; }
  .filter-switch { flex-wrap: nowrap; }
  .filter-switch button { padding: 0.4rem 0.55rem; font-size: 0.6875rem; }
  .filter-switch .label, .filter-switch .sep { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .gallery img.ph, .tile figcaption { transition: none; }
  .tile a:hover img, .sheet a:hover img { transform: none; }
}
</style>
</head>
<body>

<!-- Violet tritone: luminance mapped to black → violet → cream -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="tritone" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.039 0.482 0.929"/>
      <feFuncG type="table" tableValues="0.039 0.482 0.914"/>
      <feFuncB type="table" tableValues="0.039 0.941 0.882"/>
    </feComponentTransfer>
  </filter>
</svg>

<div class="opt-band" aria-live="polite">
  <div class="wrap">
    <span class="tag">Preview</span>
    <strong id="opt-name">Option 1 · Editorial, mono</strong>
    <span id="opt-desc"></span>
  </div>
</div>

<section class="gallery" id="gallery" aria-labelledby="gallery-heading" data-filter="mono">
  <div class="wrap">
    <div class="gallery-head">
      <div>
        <span class="kicker">Inside the exhibition</span>
        <h2 id="gallery-heading">On the walls, <em>and in the room.</em></h2>
      </div>
      <p class="gallery-note" id="gallery-note">Select any photo to see it full size.</p>
    </div>

    <div id="mosaic"></div>
  </div>
</section>

<div class="switches">
  <div class="filter-switch" role="group" aria-label="Filter">
    <span class="label">Filter</span>
    <button type="button" data-filter="mono" aria-pressed="true">Mono</button>
    <button type="button" data-filter="warm" aria-pressed="false">Warm</button>
    <button type="button" data-filter="violet" aria-pressed="false">Violet</button>
    <button type="button" data-filter="matte" aria-pressed="false">Matte</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-filter="none" aria-pressed="false">None</button>
  </div>
  <div class="opt-switch" role="group" aria-label="Option">
    <button type="button" data-opt="1" aria-pressed="true"><span class="k">1</span>Editorial <span class="tech">mono</span></button>
    <button type="button" data-opt="2" aria-pressed="false"><span class="k">2</span>Contact sheet <span class="tech">warm</span></button>
    <button type="button" data-opt="3" aria-pressed="false"><span class="k">3</span>Feature + strip <span class="tech">violet</span></button>
    <button type="button" data-opt="4" aria-pressed="false"><span class="k">4</span>Tight mosaic <span class="tech">matte</span></button>
  </div>
</div>

<script>
(function () {
  /* ---------- The photos, by upload number ---------- */
  var PHOTOS = {
    1:  ['The opening wall', 'The first four Între noi panels along a white wall: partners, methodology, the philosophy of the show and the title panel.'],
    2:  ['Panels between the columns', 'A line of hanging data panels crosses a pillared hall beside a round stairwell railing.'],
    3:  ['Births and mixed marriages', 'Close-up of a panel charting births in Italy and Romania since 1960, above a flow diagram of mixed marriages.'],
    5:  ['At the title panel', 'A visitor in a blue cap reads the Între noi title panel beside a lift.'],
    6:  ['Under the staircase', 'The exhibition seen beneath a curving marble staircase, panels strung between the columns.'],
    7:  ['Women in tech, country by country', 'Close-up of a slope chart of women among computing graduates and ICT workers: Romania 34.5, Italy 18.2.'],
    8:  ['Three panels, head on', 'Three trade panels hang side by side in front of the spiral staircase.'],
    9:  ['Putting up the poster', 'A man fixes the Între noi poster to a blue display stand at the entrance.'],
    10: ['The hall from above', 'Seen from the balcony, visitors read the opening wall across a marble floor.'],
    11: ['Opening night', 'A crowd gathers among the panels on opening night.'],
    12: ['Reading the method', 'A visitor in glasses reads the methodology and philosophy panels.'],
    13: ['The postcard', 'A hand holds the Între noi postcard with the exhibition dates.'],
    14: ['Worth a photo', 'A visitor photographs the panel on the Romanian community in Italy.'],
    15: ['Pointing out the numbers', 'A man points at a chart while three visitors listen.'],
    16: ['Talking it over', 'Visitors talk in small groups by the methodology panel.'],
    17: ['Two population pyramids', 'Close-up of a panel setting the population pyramids of Italy and Romania side by side, above a chart of births since 1960.']
  };
  function file(n, small) {
    return 'img/intre-noi-' + (n < 10 ? '0' : '') + n + (small ? '-800' : '') + '.jpg';
  }
  function two(i) { return (i < 10 ? '0' : '') + i; }
  function img(n, pos, sizes) {
    return '<img class="ph" src="' + file(n) + '" srcset="' + file(n, true) + ' 800w, ' + file(n) + ' 1600w"' +
      ' sizes="' + sizes + '" alt="' + PHOTOS[n][1] + '" width="1600" height="1066" decoding="async"' +
      (pos ? ' style="object-position:' + pos + '"' : '') + '>';
  }

  /* ---------- Tile mosaics (1 and 4) ----------
     [photo, cols, rows, phone cols, phone rows, object-position] */
  function tiles(list, cls, cols, mcols) {
    return '<div class="grid ' + cls + '">' + list.map(function (t, i) {
      var n = t[0];
      var sizes = '(min-width: 760px) ' + Math.round(t[1] / cols * 100) + 'vw, ' + Math.round(t[3] / mcols * 100) + 'vw';
      return '<figure class="tile" style="--c:' + t[1] + ';--r:' + t[2] + ';--mc:' + t[3] + ';--mr:' + t[4] + '">' +
        '<a href="' + file(n) + '" target="_blank" rel="noopener" data-caption="' + PHOTOS[n][0] + '">' + img(n, t[5], sizes) + '</a>' +
        '<figcaption><span class="n">' + two(i + 1) + '</span>' + PHOTOS[n][0] + '</figcaption></figure>';
    }).join('') + '</div>';
  }

  /* Editorial: row pairs that each add up to 12 columns
     (8+4/4, 4+4+4, 6+6, 4/4+8, 5+7, 4+4+4), so dense flow never
     reorders and the lightbox follows the page. */
  var EDITORIAL = [
    [10, 8, 2, 2, 1],
    [13, 4, 1, 1, 1, '72% 50%'],
    [5,  4, 1, 1, 1, '45% 35%'],
    [15, 4, 2, 1, 2, '50% 50%'],
    [12, 4, 2, 1, 1, '80% 50%'],
    [17, 4, 2, 1, 1, '88% 50%'],
    [2,  6, 2, 2, 1],
    [11, 6, 2, 2, 1],
    [7,  4, 1, 1, 1, '30% 40%'],
    [8,  8, 2, 1, 2, '58% 50%'],
    [3,  4, 1, 1, 1, '62% 45%'],
    [14, 5, 2, 2, 1, '40% 50%'],
    [6,  7, 2, 2, 1],
    [9,  4, 2, 1, 1, '58% 50%'],
    [16, 4, 2, 1, 1],
    [1,  4, 2, 2, 1, '88% 50%']
  ];

  /* Tight: 6 columns, groups of 3, 2, 3, 2, 3 rows; phones 3 columns. */
  var TIGHT = [
    [10, 4, 3, 3, 3],
    [12, 2, 3, 2, 2, '80% 50%'],
    [15, 2, 2, 1, 2, '50% 50%'],
    [13, 1, 1, 1, 1, '72% 50%'],
    [5,  1, 1, 1, 1, '40% 50%'],
    [17, 2, 2, 1, 1],
    [7,  1, 1, 1, 1, '30% 40%'],
    [3,  1, 1, 2, 1, '62% 45%'],
    [2,  3, 3, 3, 2],
    [11, 3, 3, 2, 2],
    [8,  3, 2, 1, 1, '55% 50%'],
    [14, 3, 2, 1, 1, '40% 50%'],
    [6,  3, 3, 3, 3],
    [16, 3, 2, 2, 2],
    [9,  1, 1, 1, 2, '58% 50%'],
    [1,  2, 1, 3, 2, '70% 50%']
  ];

  /* Contact sheet: told in order, from hanging the poster to the crowd */
  var SHEET = [9, 13, 5, 1, 10, 2, 8, 17, 6, 3, 7, 14, 12, 15, 11, 16];
  function sheet() {
    return '<div class="sheet">' + SHEET.map(function (n, i) {
      return '<figure><a href="' + file(n) + '" target="_blank" rel="noopener" data-caption="' + PHOTOS[n][0] + '">' +
        img(n, '', '(min-width: 760px) 25vw, 50vw') + '</a>' +
        '<figcaption><span class="n">' + two(i + 1) + '</span>' + PHOTOS[n][0] + '</figcaption></figure>';
    }).join('') + '</div>';
  }

  /* Feature + strip: the lead keeps a per-photo focal point, as the
     2:1 frame crops a quarter of each picture's height. */
  var FEATURE = [10, 15, 11, 2, 8, 12, 6, 14, 17, 1, 5, 9, 16, 3, 7, 13];
  var LEAD_POS = { 5: '50% 30%', 9: '50% 25%', 12: '50% 30%', 13: '50% 45%', 15: '50% 35%', 17: '50% 30%' };
  function feature() {
    var n = FEATURE[0];
    return '<div class="feature">' +
      '<div class="feature-lead">' + img(n, LEAD_POS[n] || '', '(min-width: 1280px) 1200px, 100vw') +
      '<p class="feature-cap"><span class="n">01</span><span class="t">' + PHOTOS[n][0] + '</span></p></div>' +
      '<ul class="strip">' + FEATURE.map(function (m, i) {
        return '<li><button type="button" class="thumb" data-i="' + i + '" aria-label="' + PHOTOS[m][0] + '"' +
          (i === 0 ? ' aria-current="true"' : '') + '>' +
          img(m, '', '(min-width: 760px) 12vw, 25vw') + '</button></li>';
      }).join('') + '</ul></div>';
  }
  var current = 0;
  function showLead(i) {
    var lead = document.querySelector('.feature-lead img');
    if (!lead) return;
    current = (i + FEATURE.length) % FEATURE.length;
    var n = FEATURE[current];
    document.querySelectorAll('.thumb').forEach(function (t) {
      if (+t.dataset.i === current) t.setAttribute('aria-current', 'true');
      else t.removeAttribute('aria-current');
    });
    lead.classList.add('fading');
    setTimeout(function () {
      lead.onload = function () { lead.classList.remove('fading'); };
      lead.srcset = file(n, true) + ' 800w, ' + file(n) + ' 1600w';
      lead.src = file(n);
      lead.alt = PHOTOS[n][1];
      lead.style.objectPosition = LEAD_POS[n] || '';
      document.querySelector('.feature-cap .n').textContent = two(current + 1);
      document.querySelector('.feature-cap .t').textContent = PHOTOS[n][0];
      if (lead.complete) lead.classList.remove('fading');
    }, 300);
  }

  /* ---------- Options ---------- */
  var OPTIONS = {
    1: { name: 'Option 1 · Editorial, mono', filter: 'mono',
         desc: 'The current 12-column hang, extended to all 16 photos. Black and white; colour comes back on hover.',
         note: 'Select any photo to see it full size.',
         html: function () { return tiles(EDITORIAL, '', 12, 2); } },
    2: { name: 'Option 2 · Contact sheet, warm', filter: 'warm',
         desc: 'Every frame uncropped at 3:2, four across, numbered and captioned like a proof sheet. A light, warm film grade.',
         note: 'Select any photo to see it full size.',
         html: sheet },
    3: { name: 'Option 3 · Feature + strip, violet', filter: 'violet',
         desc: 'One large frame over a strip of all 16; pick a frame (or use ← →) to bring it forward. Tritone in the site’s black, violet and cream.',
         note: 'Select a frame to bring it forward.',
         html: feature },
    4: { name: 'Option 4 · Tight mosaic, matte', filter: 'matte',
         desc: 'Six columns with 3px seams; every cell is 3:2, so sizes change without odd crops. Muted colour with lifted blacks.',
         note: 'Select any photo to see it full size.',
         html: function () { return tiles(TIGHT, 'tight', 6, 3); } }
  };

  var gallery = document.getElementById('gallery');
  var mosaic = document.getElementById('mosaic');
  var optButtons = [].slice.call(document.querySelectorAll('[data-opt]'));
  var filterButtons = [].slice.call(document.querySelectorAll('.filter-switch [data-filter]'));
  var opt = '1';

  function setFilter(f) {
    gallery.dataset.filter = f;
    filterButtons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.filter === f)); });
  }
  function setOption(k) {
    var o = OPTIONS[k];
    if (!o) return;
    opt = k;
    mosaic.innerHTML = o.html();
    current = 0;
    document.getElementById('opt-name').textContent = o.name;
    document.getElementById('opt-desc').textContent = o.desc;
    document.getElementById('gallery-note').textContent = o.note;
    optButtons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.opt === k)); });
    setFilter(o.filter);
    if (location.hash !== '#' + k) history.replaceState(null, '', '#' + k);
  }

  optButtons.forEach(function (b) { b.addEventListener('click', function () { setOption(b.dataset.opt); }); });
  filterButtons.forEach(function (b) { b.addEventListener('click', function () { setFilter(b.dataset.filter); }); });

  /* No lightbox in the preview: a photo opens full size in a new tab */
  mosaic.addEventListener('click', function (e) {
    var t = e.target.closest('.thumb');
    if (t) showLead(+t.dataset.i);
  });

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (OPTIONS[e.key]) setOption(e.key);
    if (opt === '3' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      showLead(current + (e.key === 'ArrowRight' ? 1 : -1));
    }
  });

  window.addEventListener('hashchange', function () { setOption(location.hash.slice(1)); });
  setOption(OPTIONS[location.hash.slice(1)] ? location.hash.slice(1) : '1');
})();
</script>
</body>
</html>
